apiVersion: v1
kind: Pod
metadata:
  name: user-ns
  namespace: staging-ns
spec:
  securityContext:
    runAsUser: 0
    runAsGroup: 0
    seccompProfile:
      type: RuntimeDefault
  hostUsers: false   # v1.35 user namespace isolation
  containers:
  - name: demo
    image: busybox:1.36
    command: ["sh", "-c", "id && sleep 3600"]
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop: ["ALL"]
