apiVersion: v1
kind: Service
metadata:
  name: sample-service-topology
  namespace: sample-ns
  labels:
    app: sample-app
spec:
  type: ClusterIP
  selector:
    app: sample-app
  ports:
  - name: http
    protocol: TCP
    port: 80
    targetPort: 8080
  # v1.35+ topology-aware routing
  trafficDistribution: PreferSameZone     # Prefer topologically closer endpoints
  internalTrafficPolicy: Local         # Only route to local-node endpoints when possible
